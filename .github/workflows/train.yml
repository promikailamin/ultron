name: train

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "training steps"
        default: "3000"
      batch:
        description: "batch size"
        default: "8"
      lr:
        description: "learning rate"
        default: "1.5e-3"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile
        run: javac -d build src/*.java

      - name: Train Ultron
        run: java -Xmx3g -cp build ultron.Train ${{ inputs.steps }} ${{ inputs.batch }} ${{ inputs.lr }} | tee out/train.log

      - name: Smoke test trained model
        run: |
          javac -d build src/*.java
          java -cp build ultron.TestCache
          java -cp build ultron.Generate "it was the best of times" 30 0.7 40

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: ultron-trained-model
          path: |
            out/ultron.bin
            out/train.log
            data/ultron-vocab.txt
