name: train

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Train Ultron (3000 steps, batch 8, lr 1.5e-3)
        run: |
          javac -d build src/*.java
          java -Xmx3g -cp build ultron.Train 3000 8 1.5e-3 2>&1 | tee out/train.log

      - name: Smoke test trained model
        run: |
          java -cp build ultron.TestCache
          java -cp build ultron.Generate "it was the best of times" 30 0.7 40

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: ultron-trained-model
          path: |
            out/ultron.bin
            out/train.log
            data/ultron-vocab.txt
